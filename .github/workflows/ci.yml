name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Install
        run: |
          npm ci
          npm ci --prefix server
      - name: Server tests
        run: npm test
      - name: index.html matches the sources
        run: npm run check:build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: UI tests (layout, accessibility, interaction)
        run: npm run test:ui
      - name: Upload the UI test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
